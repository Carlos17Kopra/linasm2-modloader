[workspace]
members = ["crates/core", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tempfile = "3.27"
blake3 = "1.8"
yaml-rust2 = "0.13"
steamlocate = "2.1"
zip = "8.6"
sevenz-rust2 = "0.22"
directories = "6.0"
clap = { version = "4.6", features = ["derive"] }
eframe = "0.36"
egui = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
