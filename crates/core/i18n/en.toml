[cli]
about = "Mod loader for Space Marine 2"

[cli.arg]
lang = "Language for this run (en, de); overrides the setting"

[cli.built_in]
help = "Print help"
version = "Print version"

[app.notice]
unknown_language = "Unknown language '{code}' in the settings – falling back to English"

[cli.notice]
info = "Note"
warning = "Warning"
error = "Missing"

[cli.error]
gui_start = "Error: the interface could not be started – {detail}"
prefix = "Error: {detail}"
not_installed = "{name} is not installed"
dir_create_failed = "{path} could not be created"
read_failed = "{path} could not be read"
import_failed = "{path} could not be imported"
delete_failed = "{path} could not be deleted"
tmp_dir_failed = "temporary directory could not be created"

[cli.list]
about = "Lists every mod in load order"
none_installed = "No mods installed."

[cli.enable]
about = "Enables a mod"
done = "✓ {pak} enabled"

[cli.enable.arg]
pak = "Name of the mod's .pak file"

[cli.disable]
about = "Disables a mod"
done = "✓ {pak} disabled"

[cli.disable.arg]
pak = "Name of the mod's .pak file"

[cli.order]
about = "Sets the load order; mods not named keep their relative position behind the named ones"
none_given = "No paks given."
duplicate_name = "{name} was named more than once"
done = "✓ Load order set"

[cli.order.arg]
paks = "Paks in the desired order, first named = loaded first"

[cli.install]
about = "Imports mods from .pak, .zip, .7z or .rar"
none_given = "No files given."
duplicate = "– {pak} is identical to {existing}, skipped"
done = "✓ {pak} imported (disabled)"

[cli.install.arg]
files = "Files to import"

[cli.paths]
about = "Shows the detected directories"
game = "Game:    {path}"
mods = "Mods:    {path}"
config = "Config:  {path}"
saves = "Saves:   {path}"
saves_unavailable = "Saves:   not available – {detail}"
backups = "Backups: {path}"

[cli.open]
about = "Opens a directory in the file manager"

[cli.open.arg]
target = "Directory to open"

[cli.profile]
about = "Manages profiles"
none_saved = "No profiles saved."
list_entry = "{name}  ({active} active of {total})"
saved = "✓ Profile '{name}' saved: {path}"
pak_missing = "Warning: {pak} from the profile is not installed, skipped."
applied = "✓ Profile '{name}' applied"
deleted = "✓ Profile '{name}' deleted ({path})"
not_found = "Profile '{name}' not found"
ambiguous = "several profiles match '{name}' and differ only in capitalization ({names}). Please give the exact name."

[cli.profile.list]
about = "Lists the saved profiles"

[cli.profile.save]
about = "Saves the current state as a profile"

[cli.profile.save.arg]
name = "Profile name"

[cli.profile.apply]
about = "Applies a profile"

[cli.profile.apply.arg]
name = "Profile name"

[cli.profile.delete]
about = "Deletes a profile"

[cli.profile.delete.arg]
name = "Profile name"

[cli.save]
about = "Backs up and restores savegames"
backup_done = "✓ Backup: {path}"
none_present = "No backups present."
no_backups = "no backups present"
selected = "Selected backup: {created_at}  {label}"
restored = "✓ Restored: {created_at}"
restored_safety = "  Previous state saved: {path}"
import_done = "✓ Imported: {created_at}  {label}"
import_location = "  Located at: {path}"
steam_running = "Steam is running. Cloud synchronisation can overwrite the restored state. Please quit Steam and try again, or continue at your own risk with --force."
steam_forced = "Warning: Steam is running – --force enforces the restore despite possible cloud synchronisation."
renamed = "✓ Renamed: {created_at}  {label}"
deleted = "✓ Deleted: {created_at}  {label}"
delete_confirm = "Deleting is irreversible. The selection would be: {created_at}  {label}. Confirm with --yes."
index_too_low = "index must be at least 1 (1 = newest backup)"
index_out_of_range = "backup {requested} does not exist ({count} present)"
timestamp_not_found = "no backup with timestamp '{timestamp}' found"

[cli.save.backup]
about = "Creates a backup"

[cli.save.backup.arg]
tag = "Label for the backup"

[cli.save.list]
about = "Lists the backups present"

[cli.save.restore]
about = "Restores a backup (default: the newest one)"

[cli.save.restore.arg]
index = "1-based index from `save list` (default: 1, the newest)"
at = "Exact timestamp from `save list` – unambiguous, unlike `--index` it does not shift with later restores"
force = "Forces the restore despite Steam running (risk: cloud synchronisation can overwrite the state)"

[cli.save.import]
about = "Imports a backup from another launcher: a ZIP holding the savegame files"

[cli.save.import.arg]
archive = "Path to the ZIP file"
tag = "Label for the imported backup; without one the archive's file name is used"

[cli.save.rename]
about = "Changes a backup's label (default: the newest one)"

[cli.save.rename.arg]
index = "1-based index from `save list` (default: 1, the newest)"
at = "Exact timestamp from `save list`"
tag = "New label; without one the label is removed"

[cli.save.delete]
about = "Deletes a backup for good (default: the newest one)"

[cli.save.delete.arg]
index = "1-based index from `save list` (default: 1, the newest)"
at = "Exact timestamp from `save list`"
yes = "Confirms the permanent deletion (required)"

[cli.lang]
about = "Shows or sets the language"
current = "Current language: {name}"
unknown = "Unknown language code: {code}"
set = "✓ Language set to {name}"

[cli.lang.arg]
code = "Language code (en, de); without one the current setting is shown"

[cli.play]
about = "Starts the game"
no_eac_unavailable = "Starting without EAC is not possible on this system – umu-launcher was not found (https://github.com/Open-Wine-Components/umu-launcher)."
vanilla_snapshot = "Note: previous state saved as profile '{name}' ({path})."
vanilla_snapshot_hint = "  Restore with `profile apply \"{name}\"`."
vanilla_already_disabled = "Note: already fully disabled – no new backup created."
vanilla_backup_failed = "previous state could not be saved – start refused without a backup"
save_backed_up = "✓ Save backed up: {path}"
save_backup_failed = "Warning: save backup failed – {detail}"
no_save_backup_possible = "Warning: no save backup possible – {detail}"
persist_failed = "Warning: configuration could not be saved – {detail}"
no_eac_notice = "Note: starting without EAC – multiplayer is not possible this way."
started = "✓ Game started"

[cli.play.arg]
vanilla = "Disables every mod"
no_eac = "Starts without EAC (no multiplayer)"

[error]
steam_not_found = "Steam installation not found"
game_not_found = "Space Marine 2 (AppID {app_id}) is not installed in any Steam library"
not_a_game_dir = "This does not look like a Space Marine 2 directory: {path} (expected: client_pc/root/mods)"
prefix_missing = "The Proton prefix for AppID {app_id} is missing – the game has to be started at least once"
no_save_user = "No Steam user profile found below {path}"
ambiguous_save_user = "Several Steam user profiles found ({users}) – please pick one in the settings"
unknown_save_user = "The Steam user profile '{requested}' from the settings was not found (available: {available})"
pak_config = "pak_config.yaml is malformed: {detail}"
corrupt_backup = "Backup damaged: {detail}"
unsafe_save_dir = "The save directory holds a symlink in a safety-relevant place, restore aborted: {path}"
restore_failed_after_backup = "Restore failed after a copy of the previous state had already been made (it is at {safety_backup}): {source}"
no_rar_tool = "No tool for unpacking .rar found – please install 'unar' or '7zip' (Debian/Ubuntu: apt install unar, Arch: pacman -S unarchiver, Fedora: dnf install unar)"
no_pak_in_archive = "The archive holds no .pak file: {path}"
no_save_in_archive = "The archive holds no savegame files (.cfg or .sav): {path}"
unusable_archive = "The archive cannot be imported: {detail}"
not_writable = "No write permission for {path}"
io = "I/O error at {path}: {source}"
invalid_toml = "Invalid TOML (line {line}, column {column})"
invalid_toml_unknown = "Invalid TOML"
missing_save_dir = "save directory is missing"
manifest_serialize_failed = "the manifest could not be serialized as JSON"
invalid_manifest = "Invalid manifest (line {line}, column {column})"
path_without_parent = "the path has no parent directory"
invalid_json = "Invalid JSON (line {line}, column {column})"
library_serialize_failed = "the library could not be serialized as JSON"
altered_check_unreadable = "{pak}: change check skipped (not readable: {source})"
altered_check_failed = "{pak}: change check skipped ({source})"
app_dirs_not_found = "could not determine the system's base directories"
archive_unpack_failed = "the archive could not be unpacked – is it damaged?"
invalid_pak_filename = "invalid file name"

[error.backup_defect]
not_a_zip = "the archive cannot be opened as a ZIP: {path}"
unknown_entry = "{name} is not listed in the manifest"
duplicate_entry = "{name} appears more than once in the archive"
size_mismatch = "{name} has a different size"
hash_mismatch = "{name} has a different hash"
count_mismatch = "the archive holds {found} of {expected} expected files"
invalid_path = "invalid path in the archive: {name}"
empty_path = "invalid (empty) path in the archive"
outside_save_dir = "path outside the save directory"

[error.archive_defect]
not_a_zip = "the file cannot be opened as a ZIP: {path}"
symlink = "the archive holds a symlink: {name}"
invalid_path = "invalid path in the archive: {name}"
duplicate_name = "{name} appears more than once in the archive"
too_large = "the archive unpacks to more than {limit}"

[error.size]
mib = "{value} MiB"
bytes = "{value} bytes"

[format]
decimal_separator = "."
datetime = "{year}-{month}-{day} {clock}"
byte_unit_value = "{value} bytes"

[gui.status_bar]
cancel = "Cancel"
entries = "pak_config.yaml · {count} entries"
no_game_dir = "no game directory"

[gui.top_bar]
start = "Start"
mods_active = "{total} mods · {active} active"
no_game_dir = "No game directory"
detection_failed = "Detection failed – choose the directory manually"

[gui.side_bar]
nav_mods = "Mods"
nav_profiles = "Profiles"
nav_saves = "Savegames"
nav_settings = "Settings"
mods_count_unknown = "—"
game_detected = "Game detected"
game_not_found = "Game not found"
write_not_checked = "Write access not checked yet"
write_ok = "pak_config.yaml writable"
write_denied = "Mods directory is read-only"
eac_available = "umu-run found – launch without EAC possible"
eac_unavailable = "umu-run missing – \"Without EAC\" hidden"
