[cli]
about = "Mod loader for Space Marine 2"

[cli.arg]
lang = "Language for this run (en, de); overrides the setting"

[cli.built_in]
help = "Print help"
version = "Print version"

[app.notice]
unknown_language = "Unknown language '{code}' in the settings – falling back to English"
game_not_found_context = "Space Marine 2 not found – enter the path in settings.toml under game_dir"
registration_failed = "{pak} could not be registered for the position/activation history – {detail}"
pak_restored = "{pak} was temporarily missing and was restored with its previous activation state and position."
pak_added_unlisted = "{pak} was not listed in pak_config.yaml and was adopted as active – a file in the mods directory loads anyway, uncontrolled and first."
pak_removed_missing = "{pak} is listed in pak_config.yaml, but the file is missing – entry removed."
pak_altered = "{pak} was changed outside the loader (hash differs)."
cache_save_failed = "Cache refresh in library.json could not be saved – {detail}"
base_dirs_context = "could not determine the base directories"

[cli.notice]
info = "Note"
warning = "Warning"
error = "Missing"

[cli.error]
gui_start = "Error: the interface could not be started – {detail}"
prefix = "Error: {detail}"
not_installed = "{name} is not installed"
dir_create_failed = "{path} could not be created"
read_failed = "{path} could not be read"
import_failed = "{path} could not be imported"
delete_failed = "{path} could not be deleted"
tmp_dir_failed = "temporary directory could not be created"

[cli.list]
about = "Lists every mod in load order"
none_installed = "No mods installed."

[cli.enable]
about = "Enables a mod"
done = "✓ {pak} enabled"

[cli.enable.arg]
pak = "Name of the mod's .pak file"

[cli.disable]
about = "Disables a mod"
done = "✓ {pak} disabled"

[cli.disable.arg]
pak = "Name of the mod's .pak file"

[cli.order]
about = "Sets the load order; mods not named keep their relative position behind the named ones"
none_given = "No paks given."
duplicate_name = "{name} was named more than once"
done = "✓ Load order set"

[cli.order.arg]
paks = "Paks in the desired order, first named = loaded first"

[cli.install]
about = "Imports mods from .pak, .zip, .7z or .rar"
none_given = "No files given."
duplicate = "– {pak} is identical to {existing}, skipped"
done = "✓ {pak} imported (disabled)"

[cli.install.arg]
files = "Files to import"

[cli.paths]
about = "Shows the detected directories"
game = "Game:    {path}"
mods = "Mods:    {path}"
config = "Config:  {path}"
saves = "Saves:   {path}"
saves_unavailable = "Saves:   not available – {detail}"
backups = "Backups: {path}"

[cli.open]
about = "Opens a directory in the file manager"

[cli.open.arg]
target = "Directory to open"

[cli.profile]
about = "Manages profiles"
none_saved = "No profiles saved."
list_entry = "{name}  ({active} active of {total})"
saved = "✓ Profile '{name}' saved: {path}"
pak_missing = "Warning: {pak} from the profile is not installed, skipped."
applied = "✓ Profile '{name}' applied"
deleted = "✓ Profile '{name}' deleted ({path})"
not_found = "Profile '{name}' not found"
ambiguous = "several profiles match '{name}' and differ only in capitalization ({names}). Please give the exact name."

[cli.profile.list]
about = "Lists the saved profiles"

[cli.profile.save]
about = "Saves the current state as a profile"

[cli.profile.save.arg]
name = "Profile name"

[cli.profile.apply]
about = "Applies a profile"

[cli.profile.apply.arg]
name = "Profile name"

[cli.profile.delete]
about = "Deletes a profile"

[cli.profile.delete.arg]
name = "Profile name"

[cli.save]
about = "Backs up and restores savegames"
backup_done = "✓ Backup: {path}"
none_present = "No backups present."
no_backups = "no backups present"
selected = "Selected backup: {created_at}  {label}"
restored = "✓ Restored: {created_at}"
restored_safety = "  Previous state saved: {path}"
import_done = "✓ Imported: {created_at}  {label}"
import_location = "  Located at: {path}"
steam_running = "Steam is running. Cloud synchronisation can overwrite the restored state. Please quit Steam and try again, or continue at your own risk with --force."
steam_forced = "Warning: Steam is running – --force enforces the restore despite possible cloud synchronisation."
renamed = "✓ Renamed: {created_at}  {label}"
deleted = "✓ Deleted: {created_at}  {label}"
delete_confirm = "Deleting is irreversible. The selection would be: {created_at}  {label}. Confirm with --yes."
index_too_low = "index must be at least 1 (1 = newest backup)"
index_out_of_range = "backup {requested} does not exist ({count} present)"
timestamp_not_found = "no backup with timestamp '{timestamp}' found"

[cli.save.backup]
about = "Creates a backup"

[cli.save.backup.arg]
tag = "Label for the backup"

[cli.save.list]
about = "Lists the backups present"

[cli.save.restore]
about = "Restores a backup (default: the newest one)"

[cli.save.restore.arg]
index = "1-based index from `save list` (default: 1, the newest)"
at = "Exact timestamp from `save list` – unambiguous, unlike `--index` it does not shift with later restores"
force = "Forces the restore despite Steam running (risk: cloud synchronisation can overwrite the state)"

[cli.save.import]
about = "Imports a backup from another launcher: a ZIP holding the savegame files"

[cli.save.import.arg]
archive = "Path to the ZIP file"
tag = "Label for the imported backup; without one the archive's file name is used"

[cli.save.rename]
about = "Changes a backup's label (default: the newest one)"

[cli.save.rename.arg]
index = "1-based index from `save list` (default: 1, the newest)"
at = "Exact timestamp from `save list`"
tag = "New label; without one the label is removed"

[cli.save.delete]
about = "Deletes a backup for good (default: the newest one)"

[cli.save.delete.arg]
index = "1-based index from `save list` (default: 1, the newest)"
at = "Exact timestamp from `save list`"
yes = "Confirms the permanent deletion (required)"

[cli.lang]
about = "Shows or sets the language"
current = "Current language: {name}"
unknown = "Unknown language code: {code}"
set = "✓ Language set to {name}"

[cli.lang.arg]
code = "Language code (en, de); without one the current setting is shown"

[cli.play]
about = "Starts the game"
