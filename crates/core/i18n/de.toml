[cli]
about = "Mod-Loader für Space Marine 2"

[cli.arg]
lang = "Sprache für diesen Lauf (en, de); überschreibt die Einstellung"

[cli.built_in]
help = "Hilfe anzeigen"
version = "Version anzeigen"

[app.notice]
unknown_language = "Unbekannte Sprache '{code}' in den Einstellungen – es bleibt bei Englisch"

[cli.notice]
info = "Hinweis"
warning = "Warnung"
error = "Fehlt"

[cli.error]
gui_start = "Fehler: die Oberfläche konnte nicht gestartet werden – {detail}"
prefix = "Fehler: {detail}"
not_installed = "{name} ist nicht installiert"
dir_create_failed = "{path} konnte nicht angelegt werden"
read_failed = "{path} konnte nicht gelesen werden"
import_failed = "{path} konnte nicht importiert werden"
delete_failed = "{path} konnte nicht gelöscht werden"
tmp_dir_failed = "temporäres Verzeichnis konnte nicht angelegt werden"

[cli.list]
about = "Zeigt alle Mods in Ladereihenfolge"
none_installed = "Keine Mods installiert."

[cli.enable]
about = "Aktiviert einen Mod"
done = "✓ {pak} aktiviert"

[cli.enable.arg]
pak = "Name der .pak-Datei des Mods"

[cli.disable]
about = "Deaktiviert einen Mod"
done = "✓ {pak} deaktiviert"

[cli.disable.arg]
pak = "Name der .pak-Datei des Mods"

[cli.order]
about = "Setzt die Ladereihenfolge; nicht genannte Mods behalten ihre Position dahinter"
none_given = "Keine Paks angegeben."
duplicate_name = "{name} wurde mehrfach genannt"
done = "✓ Ladereihenfolge gesetzt"

[cli.order.arg]
paks = "Paks in der gewünschten Reihenfolge, zuerst genannt = zuerst geladen"

[cli.install]
about = "Importiert Mods aus .pak, .zip, .7z oder .rar"
none_given = "Keine Dateien angegeben."
duplicate = "– {pak} ist inhaltsgleich mit {existing}, übersprungen"
done = "✓ {pak} importiert (deaktiviert)"

[cli.install.arg]
files = "Zu importierende Dateien"

[cli.paths]
about = "Zeigt die erkannten Verzeichnisse"
game = "Spiel:   {path}"
mods = "Mods:    {path}"
config = "Config:  {path}"
saves = "Saves:   {path}"
saves_unavailable = "Saves:   nicht verfügbar – {detail}"
backups = "Backups: {path}"

[cli.open]
about = "Öffnet ein Verzeichnis im Dateimanager"

[cli.open.arg]
target = "Zu öffnendes Verzeichnis"

[cli.profile]
about = "Profile verwalten"
none_saved = "Keine Profile gespeichert."
list_entry = "{name}  ({active} aktiv von {total})"
saved = "✓ Profil '{name}' gespeichert: {path}"
pak_missing = "Warnung: {pak} aus dem Profil ist nicht installiert, übersprungen."
applied = "✓ Profil '{name}' angewendet"
deleted = "✓ Profil '{name}' gelöscht ({path})"
not_found = "Profil '{name}' nicht gefunden"
ambiguous = "mehrere Profile passen zu '{name}' und unterscheiden sich nur in Groß-/Kleinschreibung ({names}). Bitte den exakten Namen angeben."

[cli.profile.list]
about = "Zeigt die gespeicherten Profile"

[cli.profile.save]
about = "Speichert den aktuellen Zustand als Profil"

[cli.profile.save.arg]
name = "Profilname"

[cli.profile.apply]
about = "Wendet ein Profil an"

[cli.profile.apply.arg]
name = "Profilname"

[cli.profile.delete]
about = "Löscht ein Profil"

[cli.profile.delete.arg]
name = "Profilname"

[cli.save]
about = "Savegames sichern und wiederherstellen"
backup_done = "✓ Backup: {path}"
none_present = "Keine Backups vorhanden."
no_backups = "keine Backups vorhanden"
selected = "Ausgewähltes Backup: {created_at}  {label}"
restored = "✓ Wiederhergestellt: {created_at}"
restored_safety = "  Vorheriger Stand gesichert: {path}"
import_done = "✓ Importiert: {created_at}  {label}"
import_location = "  Liegt unter: {path}"
steam_running = "Steam läuft. Die Cloud-Synchronisation kann den wiederhergestellten Stand überschreiben. Bitte Steam beenden und erneut versuchen, oder mit --force auf eigenes Risiko fortfahren."
steam_forced = "Warnung: Steam läuft – --force erzwingt die Wiederherstellung trotz möglicher Cloud-Synchronisation."
renamed = "✓ Umbenannt: {created_at}  {label}"
deleted = "✓ Gelöscht: {created_at}  {label}"
delete_confirm = "Löschen ist unwiderruflich. Ausgewählt wäre: {created_at}  {label}. Mit --yes bestätigen."
index_too_low = "Index muss mindestens 1 sein (1 = neuestes Backup)"
index_out_of_range = "Backup {requested} gibt es nicht ({count} vorhanden)"
timestamp_not_found = "kein Backup mit Zeitstempel '{timestamp}' gefunden"

[cli.save.backup]
about = "Legt ein Backup an"

[cli.save.backup.arg]
tag = "Etikett für das Backup"

[cli.save.list]
about = "Zeigt die vorhandenen Backups"

[cli.save.restore]
about = "Stellt ein Backup wieder her (Standard: das neueste)"

[cli.save.restore.arg]
index = "1-basierter Index aus `save list` (Standard: 1, das neueste)"
at = "Exakter Zeitstempel aus `save list` – eindeutig, verschiebt sich anders als `--index` nicht durch spätere Wiederherstellungen"
force = "Erzwingt die Wiederherstellung trotz laufendem Steam (Risiko: Cloud-Synchronisation kann den Stand überschreiben)"

[cli.save.import]
about = "Importiert ein Backup aus einem anderen Launcher: eine ZIP-Datei mit den Savegame-Dateien darin"

[cli.save.import.arg]
archive = "Pfad zur ZIP-Datei"
tag = "Etikett für das importierte Backup; ohne Angabe wird der Dateiname des Archivs verwendet"

[cli.save.rename]
about = "Ändert das Etikett eines Backups (Standard: das neueste)"

[cli.save.rename.arg]
index = "1-basierter Index aus `save list` (Standard: 1, das neueste)"
at = "Exakter Zeitstempel aus `save list`"
tag = "Neues Etikett; ohne Angabe wird das Etikett entfernt"

[cli.save.delete]
about = "Löscht ein Backup endgültig (Standard: das neueste)"

[cli.save.delete.arg]
index = "1-basierter Index aus `save list` (Standard: 1, das neueste)"
at = "Exakter Zeitstempel aus `save list`"
yes = "Bestätigt das endgültige Löschen (erforderlich)"

[cli.lang]
about = "Zeigt die Sprache an oder setzt sie"
current = "Aktuelle Sprache: {name}"
unknown = "Unbekannter Sprachcode: {code}"
set = "✓ Sprache auf {name} gesetzt"

[cli.lang.arg]
code = "Sprachcode (en, de); ohne Angabe wird die aktuelle Einstellung angezeigt"

[cli.play]
about = "Startet das Spiel"
no_eac_unavailable = "Start ohne EAC ist auf diesem System nicht möglich – umu-launcher wurde nicht gefunden (https://github.com/Open-Wine-Components/umu-launcher)."
vanilla_snapshot = "Hinweis: bisheriger Zustand als Profil '{name}' gesichert ({path})."
vanilla_snapshot_hint = "  Mit `profile apply \"{name}\"` wiederherstellen."
vanilla_already_disabled = "Hinweis: bereits vollständig deaktiviert – keine neue Sicherung angelegt."
vanilla_backup_failed = "bisheriger Zustand konnte nicht gesichert werden – Start ohne Sicherung wird verweigert"
save_backed_up = "✓ Save gesichert: {path}"
save_backup_failed = "Warnung: Save-Backup fehlgeschlagen – {detail}"
no_save_backup_possible = "Warnung: kein Save-Backup möglich – {detail}"
persist_failed = "Warnung: Konfiguration konnte nicht gespeichert werden – {detail}"
no_eac_notice = "Hinweis: Start ohne EAC – Multiplayer ist damit nicht möglich."
started = "✓ Spiel gestartet"

[cli.play.arg]
vanilla = "Alle Mods deaktivieren"
no_eac = "Ohne EAC starten (kein Multiplayer)"

