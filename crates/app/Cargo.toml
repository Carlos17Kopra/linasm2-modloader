[package]
name = "lina-sm2"
version.workspace = true
edition.workspace = true
# Higher than the rest of the workspace (1.85): `egui`/`eframe` 0.36 ask for
# 1.95. Only this binary is affected — `sm2-core` stays buildable against the
# older bound on purpose, so the domain logic remains usable as a library on
# older distributions.
rust-version = "1.95"
license.workspace = true

[dependencies]
sm2-core = { path = "../core" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
tempfile.workspace = true

# Not target-gated: a `cfg(windows)` here would be read for the machine
# running the build script, so a cross build from Linux to Windows would
# leave `build.rs` without the crate it needs. It costs one small crate on
# a Linux build and nothing else.
[build-dependencies]
winresource.workspace = true
