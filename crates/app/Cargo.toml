[package]
name = "sm2-modloader"
version.workspace = true
edition.workspace = true
# Höher als der Rest des Arbeitsbereichs (1.85): `egui`/`eframe` 0.36
# verlangen 1.95. Nur diese Binary ist davon betroffen – `sm2-core` bleibt
# absichtlich mit der älteren Grenze baubar, damit die Fachlogik auch auf
# älteren Distributionen als Bibliothek nutzbar bleibt.
rust-version = "1.95"
license.workspace = true

[dependencies]
sm2-core = { path = "../core" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
tempfile.workspace = true
